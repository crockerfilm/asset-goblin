<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Asset Goblin — Image & Video Extractor</title>
  <meta name="description" content="A simple browser-based image and video extractor for GitHub Pages." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="mark" aria-hidden="true"> goblin </div>
      <h1>Asset Goblin</h1>
      <p>Paste a page URL. Grab the images and videos. Download some or all.</p>
    </section>

    <section class="panel input-panel" aria-labelledby="extract-heading">
      <h2 id="extract-heading">Extract media</h2>
      <form id="extractForm" class="url-form">
        <input id="urlInput" type="url" placeholder="https://example.com/page" autocomplete="url" required />
        <button id="extractBtn" type="submit">Extract</button>
      </form>
      <p id="status" class="status">Ready.</p>
    </section>

    <section id="resultsPanel" class="panel results-panel" hidden>
      <div class="toolbar">
        <div>
          <h2>Found media</h2>
          <p id="countText" class="muted">0 files</p>
        </div>
        <div class="actions">
          <button id="selectAllBtn" type="button" class="secondary">Select all</button>
          <button id="selectNoneBtn" type="button" class="secondary">Select none</button>
          <button id="downloadSelectedBtn" type="button">Download selected</button>
          <button id="downloadAllBtn" type="button">Download all</button>
        </div>
      </div>

      <div class="mini-filters" aria-label="Media type filters">
        <button class="chip active" type="button" data-filter="all">All</button>
        <button class="chip" type="button" data-filter="image">Images</button>
        <button class="chip" type="button" data-filter="video">Videos</button>
      </div>

      <div id="grid" class="grid" aria-live="polite"></div>
    </section>
  </main>

  <template id="cardTemplate">
    <article class="card">
      <label class="select-wrap">
        <input type="checkbox" class="asset-check" checked />
        <span>Select</span>
      </label>
      <div class="preview"></div>
      <div class="card-body">
        <div class="card-topline">
          <span class="pill"></span>
          <span class="dims"></span>
        </div>
        <h3 class="filename"></h3>
        <p class="source"></p>
        <div class="card-actions">
          <button type="button" class="download-one">Download</button>
          <a class="open-link" target="_blank" rel="noreferrer">Open</a>
        </div>
      </div>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
